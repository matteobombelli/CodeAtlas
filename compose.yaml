services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: spring_boot_static_analysis
      POSTGRES_USER: spring_boot_static_analysis
      POSTGRES_PASSWORD: spring_boot_static_analysis
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U spring_boot_static_analysis -d spring_boot_static_analysis"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - spring-boot-static-analysis-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SPRING_BOOT_STATIC_ANALYSIS_DATABASE_URL: jdbc:postgresql://postgres:5432/spring_boot_static_analysis
      SPRING_BOOT_STATIC_ANALYSIS_DATABASE_USERNAME: spring_boot_static_analysis
      SPRING_BOOT_STATIC_ANALYSIS_DATABASE_PASSWORD: spring_boot_static_analysis
      SPRING_BOOT_STATIC_ANALYSIS_REPOSITORIES_ROOT: /workspace/repositories
      SPRING_BOOT_STATIC_ANALYSIS_DEMO_ENABLED: "true"
      SPRING_BOOT_STATIC_ANALYSIS_DEMO_DISPLAY_NAME: Spring Boot Static Analysis source
      SPRING_BOOT_STATIC_ANALYSIS_DEMO_RELATIVE_PATH: spring-boot-static-analysis
    volumes:
      - ./:/workspace/repositories/spring-boot-static-analysis:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "8080:8080"

  frontend:
    build:
      context: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  spring-boot-static-analysis-postgres:
