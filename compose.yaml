services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: sbsa
      POSTGRES_USER: sbsa
      POSTGRES_PASSWORD: sbsa
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sbsa -d sbsa"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - sbsa-postgres:/var/lib/postgresql/data

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      SBSA_DATABASE_URL: jdbc:postgresql://postgres:5432/sbsa
      SBSA_DATABASE_USERNAME: sbsa
      SBSA_DATABASE_PASSWORD: sbsa
      SBSA_REPOSITORIES_ROOT: /workspace/repositories
      SBSA_DEMO_ENABLED: "true"
      SBSA_DEMO_DISPLAY_NAME: Spring Boot Static Analysis · self-analysis
      SBSA_DEMO_RELATIVE_PATH: spring-boot-static-analysis
    volumes:
      - ./:/workspace/repositories/spring-boot-static-analysis:ro,Z
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/actuator/health | grep -q UP"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "8080:8080"

  frontend:
    build:
      context: frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  sbsa-postgres:
