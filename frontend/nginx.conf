# Two entrances serve the same bundle. The published one on 8080 is what a
# reverse proxy exposes to the internet; 8081 is bound to loopback by Compose
# and is the only one that marks requests as local, which the backend accepts
# as permission to mutate. Because $local_entrance is set here and never taken
# from the request, a visitor cannot reach the writable path by sending the
# header themselves.
server {
    listen 8080;
    set $local_entrance "";
    include /etc/nginx/entrance.conf;
}

server {
    listen 8081;
    set $local_entrance "1";
    include /etc/nginx/entrance.conf;
}
