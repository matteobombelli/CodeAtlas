name: Backend

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - run: ./gradlew :backend:test :demo-app:test --no-daemon
      - run: ./gradlew :backend:bootJar :demo-app:bootJar --no-daemon
