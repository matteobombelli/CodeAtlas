name: Compose smoke

on:
  push:
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: docker compose up --build --wait
      - run: npm run test:e2e
        working-directory: frontend
      - if: always()
        run: docker compose down --volumes --remove-orphans

  # Smokes the configuration that actually gets deployed: read-only, served
  # under a path prefix, behind a proxy that strips that prefix.
  prod-smoke:
    runs-on: ubuntu-latest
    env:
      SBSA_DB_PASSWORD: smoke-only-password
      PREFIX: /projects/spring-boot-static-analysis
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend

      - run: docker compose -f compose.yaml -f compose.prod.yaml up --build --wait -d

      - name: Start the prefix-stripping proxy
        run: |
          cat > Caddyfile <<'EOF'
          {
          	admin off
          }

          :8080 {
          	redir /projects/spring-boot-static-analysis /projects/spring-boot-static-analysis/ 308

          	handle_path /projects/spring-boot-static-analysis/* {
          		reverse_proxy 127.0.0.1:3003
          	}
          }
          EOF
          docker run -d --name smoke-proxy --network host \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine
          for _ in $(seq 30); do
            curl -fsS "http://127.0.0.1:8080$PREFIX/" >/dev/null && break
            sleep 2
          done

      - name: The API must be read-only
        run: |
          curl -fsS "http://127.0.0.1:8080$PREFIX/api/config" | tee /dev/stderr | grep -q '"readOnly":true'
          status=$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
            "http://127.0.0.1:8080$PREFIX/api/repositories/00000000-0000-0000-0000-000000000000")
          test "$status" = "405" || { echo "expected 405, got $status"; exit 1; }
          status=$(curl -s -o /dev/null -w '%{http_code}' -X POST \
            -H 'Content-Type: application/json' -d '{"displayName":"x","relativePath":"x"}' \
            "http://127.0.0.1:8080$PREFIX/api/repositories")
          test "$status" = "405" || { echo "expected 405, got $status"; exit 1; }

      - name: Assets must resolve under the prefix
        run: |
          curl -fsS "http://127.0.0.1:8080$PREFIX/" \
            | grep -o 'src="[^"]*"' | grep -q "$PREFIX/assets/"
          asset=$(curl -fsS "http://127.0.0.1:8080$PREFIX/" \
            | grep -o "$PREFIX/assets/[^\"]*\.js" | head -1)
          curl -fsS "http://127.0.0.1:8080$asset" >/dev/null

      - run: npm run test:e2e
        working-directory: frontend
        env:
          SBSA_E2E_URL: http://127.0.0.1:8080/projects/spring-boot-static-analysis/
          SBSA_E2E_READ_ONLY: "true"

      - if: always()
        run: |
          docker logs smoke-proxy || true
          docker rm -f smoke-proxy || true
          docker compose -f compose.yaml -f compose.prod.yaml down --volumes --remove-orphans
