spring:
  application:
    name: code-atlas
  datasource:
    url: ${CODE_ATLAS_DATABASE_URL:jdbc:postgresql://localhost:5432/code_atlas}
    username: ${CODE_ATLAS_DATABASE_USERNAME:code_atlas}
    password: ${CODE_ATLAS_DATABASE_PASSWORD:code_atlas}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never

server:
  shutdown: graceful

code-atlas:
  repositories-root: ${CODE_ATLAS_REPOSITORIES_ROOT:/workspace/repositories}
  max-source-file-bytes: 1048576
  max-source-files: 10000
  indexing:
    max-concurrent-jobs: 1
    queue-capacity: 10
  demo:
    enabled: ${CODE_ATLAS_DEMO_ENABLED:false}
    display-name: ${CODE_ATLAS_DEMO_DISPLAY_NAME:Code Atlas}
    relative-path: ${CODE_ATLAS_DEMO_RELATIVE_PATH:code-atlas}
