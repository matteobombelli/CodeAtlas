spring:
  application:
    name: spring-boot-static-analysis
  datasource:
    url: ${SPRING_BOOT_STATIC_ANALYSIS_DATABASE_URL:jdbc:postgresql://localhost:5432/spring_boot_static_analysis}
    username: ${SPRING_BOOT_STATIC_ANALYSIS_DATABASE_USERNAME:spring_boot_static_analysis}
    password: ${SPRING_BOOT_STATIC_ANALYSIS_DATABASE_PASSWORD:spring_boot_static_analysis}
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-components: always
      show-details: never

server:
  shutdown: graceful

spring-boot-static-analysis:
  repositories-root: ${SPRING_BOOT_STATIC_ANALYSIS_REPOSITORIES_ROOT:/workspace/repositories}
  max-source-file-bytes: 1048576
  max-source-files: 10000
  indexing:
    max-concurrent-jobs: 1
    queue-capacity: 10
  demo:
    enabled: ${SPRING_BOOT_STATIC_ANALYSIS_DEMO_ENABLED:false}
    display-name: ${SPRING_BOOT_STATIC_ANALYSIS_DEMO_DISPLAY_NAME:Spring Boot Static Analysis source}
    relative-path: ${SPRING_BOOT_STATIC_ANALYSIS_DEMO_RELATIVE_PATH:spring-boot-static-analysis}
